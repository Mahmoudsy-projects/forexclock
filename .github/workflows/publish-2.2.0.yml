name: Publish Forex Clock 2.2.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-2.2.0.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Publish Windows portable release
        shell: pwsh
        run: |
          $exe = 'dist/ForexClock-portable-2.2.0.exe'
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  ForexClock-portable-2.2.0.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          gh release create v2.2.0 $exe docs/ForexClock-Guide-fa.pdf dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title 'Forex Clock v2.2.0' --notes 'Next Point countdown, Key Time timeline markers, continuous compact resizing, and updated Persian guide. The checksum asset applies to this release build.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
