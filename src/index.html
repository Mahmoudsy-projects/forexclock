<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self';">
<title>Forex Clock</title>
<link rel="stylesheet" href="style.css">
<script src="boot.js"></script>
</head>
<body>
<div id="app">
<div id="card" class="card">
  <header class="hdr">
    <div class="ttl"><b>TEHRAN</b><span id="tzTag">UTC+03:30</span></div>
    <div class="hr">
      <div class="theme" role="group" aria-label="Theme">
        <button type="button" id="tLight" class="" title="Light theme" aria-label="Light theme" aria-pressed="false"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button type="button" id="tDark" class="" title="Dark theme" aria-label="Dark theme" aria-pressed="true"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
      </div>
      <div class="wc" role="group" aria-label="Window controls">
        <button type="button" id="bPin" class="wb" title="Always on top" aria-label="Always on top"><svg class="ico" width="13" height="13" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6z"/></svg></button>
        <button type="button" id="bLock" class="wb" title="Lock position & size" aria-label="Lock position & size"><svg class="ico" width="12" height="12" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
        <button type="button" id="bMax" class="wb" title="Compact view (maximize / restore)" aria-label="Compact view (maximize / restore)"><svg class="ico" width="12" height="12" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button>
        <button type="button" id="bCfg" class="wb" title="Settings" aria-label="Settings"><svg class="ico" width="13" height="13" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <button type="button" id="bHide" class="wb" title="Minimize to tray" aria-label="Minimize to tray"><svg class="ico" width="12" height="12" viewBox="0 0 24 24" stroke-width="2.4" aria-hidden="true"><path d="M6 12h12"/></svg></button>
      </div>
    </div>
  </header>

  <section class="digital">
    <div class="time"><span id="hm">--:--</span><span id="sec">:--</span><span id="ampm"></span></div>
    <div class="dt" id="dateEn"></div>
    <div class="dt fa" id="dateFa" dir="rtl" lang="fa"></div>
  </section>

  <div class="key-count" id="keyFull">NEXT POINT --:--:--</div>
  <div class="dialwrap" id="dialFull"></div>

  <section class="evs">
    <div class="evh"><span>NEXT EVENTS</span><span class="mono">Tehran time</span></div>
    <div class="evl" id="events"></div>
  </section>

  <div class="tlwrap">
  <section class="tl" id="tl">
    <div class="axis" id="axis"></div>
    <div id="rows" class="contents"></div>
    <div class="oband" id="oband" hidden></div>
    <div class="key-line" id="keyPrevLine"></div>
    <div class="key-line key-next" id="keyNextLine"></div>
    <div class="key-label" id="keyPrevLabel"></div>
    <div class="key-label key-next" id="keyNextLabel"></div>
    <div class="nowline" id="nowline"></div>
    <div class="nowpill" id="nowpill">NOW --:--</div>
  </section>
  <div class="ovline" id="overlapsLine"></div>
  </div>

  <label class="opac nodrag">Opacity <input type="range" id="opacMain" min="40" max="100" step="1" aria-label="Opacity"></label>
  <div class="vgrip" id="vgrip" title="Drag to resize"></div>

  <aside class="settings" id="settings" hidden>
    <h3>Settings <button id="cfgClose" class="x">Done</button></h3>
    <label class="row">Transparency <input type="range" id="opac" min="40" max="100" step="1"><span id="opacV"></span></label>
    <label class="row">View
      <select id="viewMode"><option value="full">Full (dashboard)</option><option value="compact">Compact (dial only)</option></select>
    </label>
    <label class="row">Theme
      <select id="themeSel"><option value="dark">Dark</option><option value="light">Light</option></select>
    </label>
    <label class="chk"><input type="checkbox" id="optTop"> Always on top</label>
    <label class="chk"><input type="checkbox" id="optLock"> Lock position &amp; size</label>
    <label class="chk"><input type="checkbox" id="optStart"> Start with Windows</label>
    <label class="chk"><input type="checkbox" id="opt12"> 12-hour format</label>
    <label class="chk"><input type="checkbox" id="optTray"> Close button hides to tray</label>

    <h4>Session hours <small>(local time of each market)</small></h4>
    <div id="sessEdit" class="sessEdit"></div>
    <div class="row2">
      <button id="sessApply" class="primary">Apply hours</button>
      <button id="sessReset">Reset defaults</button>
    </div>
    <div id="sessMsg" class="msg"></div>
    <p class="hint">Sessions follow each city's own IANA time zone and DST automatically. Weekends are closed; list local holidays as YYYY-MM-DD, comma separated.</p>
    <div class="row2"><button id="btnQuit" class="danger">Quit application</button></div>
    <p class="hint" id="cfgFile"></p>
  </aside>
</div>

<!-- compact view: only the round dial; buttons follow the drag layer in the DOM (Chromium applies drag/no-drag rects in document order) -->
<div id="cmp" class="cmp">
  <div class="key-count" id="keyCompact">NEXT POINT --:--:--</div>
  <div id="dialCmp"></div>
  <div class="compact-controls">
  <button type="button" id="cCfg" class="cb" title="Settings (opens full view)" aria-label="Settings (opens full view)"><svg class="ico" width="13" height="13" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  <button type="button" id="cView" class="cb" title="Maximize (full widget)" aria-label="Maximize (full widget)"><svg class="ico" width="12" height="12" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button>
  <button type="button" id="cPin" class="cb" title="Always on top" aria-label="Always on top"><svg class="ico" width="13" height="13" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6z"/></svg></button>
  <button type="button" id="cLock" class="cb" title="Lock position & size" aria-label="Lock position & size"><svg class="ico" width="12" height="12" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
  <button type="button" id="cHide" class="cb" title="Minimize to tray" aria-label="Minimize to tray"><svg class="ico" width="12" height="12" viewBox="0 0 24 24" stroke-width="2.4" aria-hidden="true"><path d="M6 12h12"/></svg></button>
  <button type="button" id="cLight" class="cb theme-b" title="Light theme" aria-label="Light theme" aria-pressed="false"><svg class="ico" width="13" height="13" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button type="button" id="cDark" class="cb theme-b" title="Dark theme" aria-label="Dark theme" aria-pressed="true"><svg class="ico" width="13" height="13" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
  </div>
  <div id="compactGrip" class="compact-grip nodrag" title="Drag to resize"></div>
</div>
</div>
<script src="tz.js"></script>
<script src="key-time.js"></script>
<script src="renderer.js"></script>
</body>
</html>
